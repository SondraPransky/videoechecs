<!--

  question en très grand, « Nous avons la solution ! », la réponse propre à chaque question, l'appel final.

<style>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const prm = new URLSearchParams(location.search);
const Q = +(prm.get("q") || 1), FMT = prm.get("fmt") || "story", THEME = prm.get("theme") || "nuit";
document.body.classList.add(FMT, THEME);
const nb = s => s.replace(/ ([?!:;])/g, " $1");
const P = "../assets/pieces/", HD = "../assets/captures/ee/hd/";
const CK = `<svg width="20" height="20" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const PLAY = s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="#111"/></svg>`;

function board(el, placement, size) {
  const F = "abcdefgh";
  el.style.width = el.style.height = size + "px";
  for (const [sq, c] of Object.entries(placement)) {
    const d = document.createElement("div");
    d.className = "pc"; d.style.left = F.indexOf(sq[0]) * 12.5 + "%"; d.style.top = (8 - +sq[1]) * 12.5 + "%";
    d.style.backgroundImage = `url(${P}${c}.png)`; el.appendChild(d);
  }
}

// ---------- Contenus ----------
const ADS = {
  1: {
    q: ["Vous enchaînez les parties,", "mais votre classement ne bouge pas ?"], pose: "gratte-tete",
    pv: `<small>Votre classement Elo</small><div class="n" id="pvn">1 201</div><span class="tag bad">± 0 en 3 mois</span>
      <svg class="tr" width="380" height="200" viewBox="0 0 380 200"><path id="pvl" d="M0,100 L40,92 L75,108 L115,96 L155,104 L195,94 L235,110 L275,98 L315,104 L350,96 L380,102" fill="none" stroke="#93b9e2" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="700" stroke-dashoffset="700"/><path d="M0,100 L380,100" stroke="rgba(255,90,106,.55)" stroke-width="3" stroke-dasharray="10 10"/></svg>`,
    sk: "Le déclic", st: ["Jouer ne suffit pas.", "Entraînez-vous avec méthode."], ps: "haltere",
    sv: `<small>Votre classement Elo</small><div class="n" id="svn">1 201</div><span class="tag ok" id="svt">▲ +211</span>
      <svg class="chart" viewBox="0 0 772 260" preserveAspectRatio="none"><defs><linearGradient id="ga" x1="0" x2="1"><stop offset="0" stop-color="#93b9e2"/><stop offset="1" stop-color="#fae361"/></linearGradient></defs>
      <path id="svl" d="M0,230 L90,222 L170,200 L250,196 L330,160 L410,150 L490,112 L570,100 L650,62 L772,30" fill="none" stroke="url(#ga)" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="1000" stroke-dashoffset="1000"/></svg>
      <div class="mods">${["Tactique", "Finales", "Ouvertures"].map(m => `<div class="mod"><span class="ck">${CK}</span>${m}</div>`).join("")}</div>`,
    cap: "Un programme par niveau, <b>de l'initiation à 2000+</b>.",
  },
  2: {
    q: ["Vous jouez beaucoup,", "mais vous n'avez pas l'impression de progresser ?"], pose: "sprint",
    pv: `<small>Parties jouées ce mois-ci</small><div class="n" id="pvn">0</div>
      <div class="games">${["0-1", "1-0", "0-1", "½", "0-1", "1-0", "0-1", "0-1"].map(r => `<div class="pg"><b>${r}</b></div>`).join("")}</div>`,
    sk: "Le déclic", st: ["Jouez moins,", "comprenez plus."], ps: "loupe",
    sv: `<small>Analyse de votre partie</small><div class="board" id="sb" style="left:44px;top:90px"></div>
      <div class="moves" style="top:90px">

  4: {

      <div class="vids">${["p-calcul-gagnant", "p-minute-finale", "p-ouvertures-vogue"].map(v => `<div class="vd"><img src="${HD}${v}.jpg"><span>${PLAY(20)}</span></div>`).join("")}</div>
      <div style="margin-top:20px"><span class="tag bad">Classement : inchangé</span></div>`,
    sk: "Le déclic", st: ["Ne regardez plus,", "jouez !"], ps: "bonne-reponse",
    sv: `<small>Leçon : la Minute Finale</small>
      <div class="player" id="pl"><img src="${HD}p-minute-finale.jpg"><div class="pl">${PLAY(48)}</div><div class="pb"><i id="plb"></i></div></div>
      <div id="try" style="position:absolute;left:44px;right:44px;top:90px;height:330px;border-radius:22px;background:#f1f0ea;opacity:0">
        <div class="board" id="tb" style="left:20px;top:20px"></div>
        <div style="position:absolute;left:340px;top:40px;color:#111;font:800 40px/1.1 Manrope">À vous<br>de jouer !</div>
        <div style="position:absolute;left:340px;top:150px;color:#6b6b66;font:700 26px/1.25 Manrope">Les Blancs jouent<br>et matent en 1.</div>
        <div class="ok-chip" id="okc" style="left:340px;top:240px">${CK} Bonne réponse</div></div>
      <div class="fmts">${["Vidéo", "Cours", "Exercice", "Quiz"].map(f => `<div class="fm">${f}</div>`).join("")}</div>`,
    cap: "<b>Vidéo, cours, exercice, quiz</b> : vous pratiquez tout de suite.",
  },
  5: {
    q: ["Vous voulez progresser aux échecs,", "mais vous ne savez pas par où commencer ?"], pose: "haussement",
    pv: `<div class="sign"></div>${[["Ouvertures ?", 120, 70, -6, "#93b9e2"], ["Tactique ?", 450, 140, 5, "#fae361"], ["Finales ?", 100, 230, -4, "#6bdc7d"], ["Stratégie ?", 440, 310, 6, "#f06b8a"]]
      .map(([l, x, y, r, c], i) => `<div class="arrow ar" style="left:${x}px;top:${y}px;background:${c};transform:rotate(${r}deg);clip-path:polygon(${i % 2 ? "0 0,88% 0,100% 50%,88% 100%,0 100%" : "12% 0,100% 0,100% 100%,12% 100%,0 50%"});padding-${i % 2 ? "right" : "left"}:54px">${l}</div>`).join("")}`,
    sk: "Le déclic", st: ["Suivez le guide,", "étape par étape."], ps: "marche",
    sv: `<small>Votre parcours</small><div class="path"><i id="pth"></i></div>
      ${["2000 et +", "Objectif 1800", "Objectif 1600", "Objectif 1400", "Initiation"].map((l, i) => `<div class="stp" data-i="${4 - i}" style="top:${110 + i * 118}px"><span class="dt">${CK}</span>${l}</div>`).join("")}
      <div class="here" id="here" style="left:520px;top:582px">Vous êtes ici</div>`,
    cap: "Un parcours clair, <b>du premier coup à 2000+</b>.",
  },
};
const AD = ADS[Q] || ADS[1];

// Question : un mot à la fois, la fin en italique jaune
const words = (txt, cls) => nb(txt).split(" ").map(w => `<span class="wd ${cls}">${w} </span>`).join("");
$("#qt").innerHTML = words(AD.q[0], "") + "<br>" + `<span class="e">${words(AD.q[1], "")}</span>`;
$("#pv").innerHTML = AD.pv;
$("#pq").innerHTML = window.MASCOT_POSES[AD.pose + (FMT === "wide" ? "" : "-miroir")];
$("#rt").innerHTML = `Nous avons<br><span class="e">${Q % 2 ? "la solution !" : "pensé à vous !"}</span>`;
$("#sk").textContent = AD.sk;
$("#stt").innerHTML = nb(AD.st[0]) + `<br><span class="e">${nb(AD.st[1])}</span>`;
$("#sv").innerHTML = AD.sv;
$("#cap").innerHTML = nb(AD.cap);
$("#ps").innerHTML = window.MASCOT_POSES[AD.ps];
$$(".pose[data-pose]").forEach(el => { el.innerHTML = window.MASCOT_POSES[el.dataset.pose]; });
if (Q === 2) {
  board($("#sb"), { g1: "wK", f1: "wR", d1: "wQ", h7: "bP", g7: "bP", f7: "bP", g8: "bK", f8: "bR", d7: "bN", e7: "bB", c3: "wN", f3: "wN", e4: "wP", d4: "wP", h2: "wP", g2: "wP", f2: "wP", b7: "bP", a7: "bP", d5: "bP" }, 370);
}
if (Q === 4) board($("#tb"), { g8: "bK", h7: "bP", g7: "bP", f7: "bP", e1: "wR", g1: "wK", f2: "wP", g2: "wP", h2: "wP" }, 290);

// Le texte de la question remplit la place disponible sans déborder
const MAXQ = { story: 720, feed: 560, wide: 640 }[FMT];
const fit = (el, max) => { let f = parseFloat(getComputedStyle(el).fontSize); while (el.offsetHeight > max && f > 40) { f -= 2; el.style.fontSize = f + "px"; } };
fit($("#qt"), MAXQ);
fit($("#stt"), { story: 260, feed: 200, wide: 300 }[FMT]);
fit($("#cap"), { story: 260, feed: 420, wide: 200 }[FMT]);

// Confettis déterministes
const COLS = ["#fae361", "#93b9e2", "#6bdc7d", "#ff8fa0", "#f4f1ea", "#111"];
function confetti(el, n, seed) {
  let sd = seed; const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  return Array.from({ length: n }, (_, i) => {
    const c = document.createElement("i"); c.style.background = COLS[i % COLS.length]; el.appendChild(c);
    const a = r() * Math.PI * 2, v = 280 + r() * 560;
    return { c, x: Math.cos(a) * v, y: Math.sin(a) * v * .8 - 200, rot: (r() - .5) * 900, fall: 420 + r() * 420 };
  });
}
function burst(st, parts, t, life = 1.8) {
  parts.forEach(p => {
    st.fromTo(p.c, { x: 0, y: 0, rotation: 0, opacity: 1, scale: 0 }, { x: p.x, y: p.y, rotation: p.rot * .4, scale: 1, duration: .55, ease: "expo.out" }, t);
    st.to(p.c, { y: p.y + p.fall, rotation: p.rot, duration: life - .55, ease: "power1.in" }, t + .55);
    st.to(p.c, { opacity: 0, duration: .4, ease: "none" }, t + life - .4);
  });
}
const W = innerWidth, H = innerHeight;
$("#confR").style.left = W / 2 + "px"; $("#confR").style.top = H * .4 + "px";
$("#confC").style.left = W / 2 + "px"; $("#confC").style.top = H * .3 + "px";
const confR = confetti($("#confR"), 60, 7), confC = confetti($("#confC"), 60, 19);

// ---------- Timeline ----------
gsap.defaults({ ease: "expo.out" });
const tl = gsap.timeline({ paused: true });
const SC = [["q", 0, 3.9], ["r", 3.9, 1.5], ["s", 5.4, 6.2], ["c", 11.6, 3.4]];
const TOTAL = 15;
const SFX = [];
const sfx = (type, t, o = {}) => SFX.push({ type, t: +t.toFixed(3), g: o.g ?? 1, p: o.p ?? 1 });
const poses = [];
const pose = (sel, t) => poses.push({ el: $(sel), start: t });
const at = (sel, t, v) => tl.to(sel, v, t);
const from = (sel, t, a, b) => tl.fromTo(sel, a, b, t);

for (const [id, t0, d] of SC) {
  from("#" + id, t0, { opacity: 0, scale: 1.05, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: .35, ease: "power3.out" });
  if (id !== "c") at("#" + id, t0 + d - .3, { opacity: 0, scale: .97, filter: "blur(10px)", duration: .3, ease: "power2.in" });
}
tl.fromTo("#glow1", { x: 0, y: 0 }, { x: 700, y: 400, duration: TOTAL, ease: "sine.inOut" }, 0);
tl.fromTo("#glow2", { x: 0, y: 0 }, { x: -600, y: -300, duration: TOTAL, ease: "sine.inOut" }, 0);
tl.fromTo("#grid", { backgroundPosition: "0px 0px, 0px 0px" }, { backgroundPosition: "0px 1200px, 0px 0px", duration: TOTAL, ease: "none" }, 0);
tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 11.6, ease: "none" }, 0);
at("#bar", 11.6, { opacity: 0, duration: .3 });
from("#logo", 0, { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: .6 });
at("#logo", 11.4, { opacity: 0, duration: .25 });

// 1. Question
const wds = $$("#qt .wd");
from(wds, .1, { opacity: 0, y: 50, rotationX: -70, transformPerspective: 600 }, { opacity: 1, y: 0, rotationX: 0, duration: .5, stagger: Math.min(.11, 1.7 / wds.length) });
sfx("whoosh", .05, { g: .5 });
wds.forEach((w, i) => { if (i % 3 === 0) sfx("key", .15 + i * Math.min(.11, 1.7 / wds.length), { g: .25, p: .9 + (i % 5) * .05 }); });
from("#pv", 1.2, { opacity: 0, y: 80, rotationX: 25, transformPerspective: 1600 }, { opacity: 1, y: 0, rotationX: 0, duration: .7 });
from("#pq", 1.4, { y: 500 }, { y: 0, duration: .6, ease: "back.out(1.4)" });
pose("#pq", 1.4);
sfx("pop", 1.3, { g: .5, p: .8 });
if (Q === 1) {
  at("#pvl", 1.5, { strokeDashoffset: 0, duration: 2, ease: "none" });
  const v = { k: 0 };
  tl.to(v, { k: 1, duration: 2.2, ease: "none", onUpdate: () => { $("#pvn").textContent = ["1 201", "1 204", "1 197", "1 202", "1 199", "1 201"][Math.floor(v.k * 5.99)]; } }, 1.5);
  [1.9, 2.4, 2.9].forEach(t => sfx("tick", t, { g: .3 }));
} else if (Q === 2) {
  from(".pg", 1.5, { opacity: 0, scale: .4, y: -30 }, { opacity: 1, scale: 1, y: 0, duration: .3, stagger: .14, ease: "back.out(2)" });
  const v = { n: 0 };
  tl.to(v, { n: 247, duration: 2, ease: "power1.in", onUpdate: () => { $("#pvn").textContent = Math.round(v.n); } }, 1.4);
  [0, 2, 4, 6].forEach(k => sfx("pop", 1.55 + k * .14, { p: .9 + k * .04, g: .3 }));
} else if (Q === 3) {
  from(".mo", 1.5, { opacity: 0, rotationX: -90, transformPerspective: 800 }, { opacity: 1, rotationX: 0, duration: .4, stagger: .45 });
  tl.fromTo("#pvb", { width: "36%" }, { width: "42%", duration: .45, yoyo: true, repeat: 4, ease: "sine.inOut" }, 1.6);
  [0, 1, 2].forEach(k => sfx("click", 1.55 + k * .45, { g: .3 }));
} else if (Q === 4) {
  from(".vd", 1.5, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .4, stagger: .18 });
  const v = { h: 0 };
  tl.to(v, { h: 12, duration: 1.8, ease: "power1.out", onUpdate: () => { $("#pvn").textContent = Math.round(v.h) + " h"; } }, 1.5);
  sfx("click", 1.6, { g: .4 });
} else {
  from(".sign", 1.4, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: .4 });
  from(".ar", 1.6, { opacity: 0, scale: .4 }, { opacity: 1, scale: 1, duration: .35, stagger: .25, ease: "back.out(2.4)" });
  [0, 1, 2, 3].forEach(k => sfx("pop", 1.65 + k * .25, { p: .9 + k * .1, g: .4 }));
}

// 2. Nous avons la solution !
const R0 = 3.9;
tl.fromTo("#flash", { opacity: 0 }, { opacity: THEME === "soleil" ? .6 : .45, duration: .05, ease: "none" }, R0).to("#flash", { opacity: 0, duration: .5, ease: "power2.out" }, ">");
from("#rt", R0 + .05, { scale: .6, opacity: 0 }, { scale: 1, opacity: 1, duration: .6, ease: "back.out(1.8)" });
from("#rs", R0 + .45, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .5 });
from("#pr", R0 + .2, { y: 500 }, { y: 0, duration: .5, ease: "back.out(1.5)" });
pose("#pr", R0 + .2);
burst(tl, confR, R0 + .05, 1.6);
sfx("pop", R0 + .1, { p: .75, g: .7 });

// 3. La réponse propre à la question
const S0 = 5.4;
from("#sk", S0 + .1, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: .5 });
from("#stt", S0 + .15, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: .7 });
from("#sv", S0 + .5, { opacity: 0, y: 90, rotationX: 22, transformPerspective: 1600 }, { opacity: 1, y: 0, rotationX: 0, duration: .8 });
from("#cap", S0 + 1, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: .6 });
from("#ps", S0 + .8, { scale: 0, transformOrigin: "50% 100%" }, { scale: 1, duration: .5, ease: "back.out(1.8)" });
pose("#ps", S0 + .8);
sfx("whoosh", S0, { g: .5 }); sfx("pop", S0 + .6, { g: .4 });
if (Q === 1) {
  at("#svl", S0 + 1, { strokeDashoffset: 0, duration: 3, ease: "power1.inOut" });
  const v = { n: 1201 };
  tl.to(v, { n: 1412, duration: 3, ease: "power1.inOut", onUpdate: () => { $("#svn").textContent = String(Math.round(v.n)).replace(/(\d)(\d{3})$/, "$1 $2"); } }, S0 + 1);
  from("#svt", S0 + 3.9, { opacity: 0, scale: .5 }, { opacity: 1, scale: 1, duration: .4, ease: "back.out(2.5)" });
  from(".mod", S0 + 1.4, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .4, stagger: .9 });
  from(".mod .ck", S0 + 1.7, { scale: 0 }, { scale: 1, duration: .35, stagger: .9, ease: "back.out(3)" });
  [0, 1, 2].forEach(k => sfx("pop", S0 + 1.75 + k * .9, { p: .75, g: .45 }));
  sfx("pop", S0 + 3.95, { p: .7, g: .5 });
} else if (Q === 2) {
  from(".mv", S0 + .9, { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: .35, stagger: .2 });
  from("#err", S0 + 1.6, { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: .35 });
  at("#err", S0 + 1.9, { x: 8, duration: .06, yoyo: true, repeat: 5, ease: "none" });
  from("#best", S0 + 2.6, { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: .4 });
  from("#exo", S0 + 3.4, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: .5 });
  $$("#exo .dt").forEach((d, k) => tl.to(d, { backgroundColor: "#2c9a45", duration: .2 }, S0 + 4 + k * .45));
  sfx("click", S0 + 1.65, { g: .5, p: .7 }); sfx("pop", S0 + 2.65, { p: .75, g: .5 });
  [0, 1, 2].forEach(k => sfx("pop", S0 + 4 + k * .45, { p: .75, g: .4 }));
} else if (Q === 3) {
  from(".coach", S0 + .9, { opacity: 0, scale: .7, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: .5, stagger: .3, ease: "back.out(1.6)" });
  from("#live", S0 + 2.2, { opacity: 0, scale: .5 }, { opacity: 1, scale: 1, duration: .4, ease: "back.out(2.5)" });
  tl.to("#live i", { opacity: .2, duration: .4, yoyo: true, repeat: 7, ease: "sine.inOut" }, S0 + 2.5);
  [0, 1, 2, 3].forEach(k => sfx("pop", S0 + 1 + k * .3, { p: .9 + k * .08, g: .4 }));
  sfx("pop", S0 + 2.25, { p: .7, g: .5 });
} else if (Q === 4) {
  at("#plb", S0 + 1, { scaleX: 1, duration: 1.6, ease: "none" });
  at(".fm:nth-child(1)", S0 + 1, { backgroundColor: "#fae361", color: "#111", duration: .2 });
  at("#try", S0 + 2.7, { opacity: 1, duration: .35 });
  from("#try", S0 + 2.7, { rotationY: -90, transformPerspective: 1400 }, { rotationY: 0, duration: .6 });
  at(".fm:nth-child(1)", S0 + 2.7, { backgroundColor: "rgba(147,185,226,.14)", color: "#c9d1dc", duration: .2 });
  at(".fm:nth-child(3)", S0 + 2.7, { backgroundColor: "#fae361", color: "#111", duration: .2 });
  // Te8# : la tour monte de e1 en e8
  const rook = [...$$("#tb .pc")].find(d => d.style.backgroundImage.includes("wR"));
  at(rook, S0 + 3.6, { top: "0%", duration: .45, ease: "power3.inOut" });
  from("#okc", S0 + 4.2, { opacity: 0, scale: .5 }, { opacity: 1, scale: 1, duration: .4, ease: "back.out(2.5)" });
  sfx("click", S0 + 1, { g: .4 }); sfx("whoosh", S0 + 2.7, { g: .4 }); sfx("move", S0 + 4.05); sfx("pop", S0 + 4.25, { p: .75, g: .6 });
} else {
  from(".stp", S0 + .9, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: .35, stagger: { each: .12, from: "end" } });
  from("#here", S0 + 1.6, { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: .4 });
  const stp = i => $(`.stp[data-i="${i}"]`);
  [0, 1, 2].forEach(i => tl.call(() => {}, [], S0 + 2.2 + i * .9));
  at("#pth", S0 + 2.1, { scaleY: .5, duration: 2.7, ease: "power1.inOut" });
  [0, 1, 2].forEach(i => {
    at(stp(i), S0 + 2.1 + i * .9, { color: "#f4f1ea", duration: .2 });
    at(stp(i).querySelector(".dt"), S0 + 2.1 + i * .9, { backgroundColor: "#fae361", borderColor: "#fae361", scale: 1.25, duration: .2 });
    at(stp(i).querySelector(".dt"), S0 + 2.3 + i * .9, { scale: 1, duration: .3 });
    sfx("pop", S0 + 2.1 + i * .9, { p: .75, g: .45 });
  });
  at("#here", S0 + 2.2, { top: 582 - 2 * 118, duration: 2.6, ease: "power1.inOut" });
}

// 4. Appel final
const C0 = 11.6;
from("#lg2w", C0, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: .8, ease: "expo.inOut" });
from("#lg2", C0, { scale: 1.12, filter: "blur(10px) " + (THEME === "soleil" ? "brightness(0)" : "") }, { scale: 1, filter: "blur(0px) " + (THEME === "soleil" ? "brightness(0)" : ""), duration: 1 });
from("#ct", C0 + .5, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .6 });
from("#btn", C0 + 1, { opacity: 0, y: 40, scale: .85 }, { opacity: 1, y: 0, scale: 1, duration: .6, ease: "back.out(1.7)" });
at("#btn", C0 + 1.7, { scale: 1.05, duration: .4, ease: "sine.inOut", yoyo: true, repeat: 3 });
from("#url", C0 + 1.4, { opacity: 0 }, { opacity: 1, duration: .5 });
from("#pc", C0 + 1.3, { y: 400, opacity: 0 }, { y: 0, opacity: 1, duration: .5, ease: "back.out(1.5)" });
pose("#pc", C0 + 1.3);
burst(tl, confC, C0 + .1, 2);
sfx("whoosh", C0, { g: .5 }); sfx("pop", C0 + 1.05, { p: .8 }); 
tl.set({}, {}, TOTAL);

window.TOTAL = TOTAL;
window.TIMING = { total: TOTAL, scenes: SC.map(([id, start, dur]) => ({ id, start, dur })) };
window.SFX = SFX.sort((a, b) => a.t - b.t);
poses.forEach(p => { p.anims = p.el.getAnimations({ subtree: true }); p.anims.forEach(a => a.pause()); });
window.seekTo = t => {
  tl.seek(t, false);
  for (const p of poses) { const ms = Math.max(0, t - p.start) * 1000; p.anims.forEach(a => { a.currentTime = ms; }); }
};
window.ready = document.fonts.ready.then(() => Promise.all($$("img").map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; }))));
</script>
