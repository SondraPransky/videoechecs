<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -330 1160 1420" class="mascotte mascotte-reflexion mascotte-reflexion-blanc" role="img" aria-label="Réflexion">
<style>
.mascotte.mascotte-reflexion-blanc { --mascot: #ffffff; --line: #fae361; }
.mascotte-reflexion .m { fill: var(--mascot); }
.mascotte-reflexion .shadow { fill: var(--mascot); opacity: .12; }
.mascotte-reflexion g { transform-box: view-box; transform-origin: 0 0; }
.mascotte-reflexion .rig { animation: reflexion-sway 3s ease-in-out infinite; }
@keyframes reflexion-sway { 0%,100%{transform:rotate(-1.5deg)} 50%{transform:rotate(1.5deg)} }
.mascotte-reflexion .arm { animation: reflexion-arm .6s cubic-bezier(.16,1,.3,1) both, reflexion-tap 1.5s ease-in-out .6s infinite; }
@keyframes reflexion-arm { from{transform:rotate(0)} to{transform:rotate(38deg)} }
@keyframes reflexion-tap { 0%,100%{transform:rotate(38deg)} 50%{transform:rotate(33deg)} }
.mascotte-reflexion .bub { animation: reflexion-bub .5s cubic-bezier(.34,1.56,.64,1) .3s both; }
@keyframes reflexion-bub { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
.mascotte-reflexion .dt { animation: reflexion-dot 1.2s ease-in-out infinite; }
@keyframes reflexion-dot { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-34px)} }
.mascotte-reflexion .dt0 { animation-delay: 0.80s; }
.mascotte-reflexion .dt1 { animation-delay: 0.98s; }
.mascotte-reflexion .dt2 { animation-delay: 1.16s; }
@media (prefers-reduced-motion: reduce) { .mascotte-reflexion * { animation: none !important; } }
</style>
